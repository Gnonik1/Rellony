<!-- /go/check-link/ is not a page anyone is meant to see. The home page counts
     one step of its funnel as a page view of this path, by moving its own

     in /index.html). This file exists only so that anyone who does arrive
     here, from a reload or a copied address, lands on the home page.

     noindex, and robots.txt disallows /go/ as well. No analytics snippet,
     deliberately: a visit here must not be counted as the step itself. No
     stylesheet, fonts or anything else to load — the background colour is
     the home page's olive, so the moment before the redirect does not flash
     white. -->

<meta http-equiv="refresh" content="0; url=/">
