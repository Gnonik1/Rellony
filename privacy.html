<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- ==========================================================================
     REDIRECT STUB. The policy itself lives at /privacy/ (privacy/index.html).

     This file only exists so that links people already hold, and anything a
     search engine indexed while the page was served from /privacy.html, do
     not land on a 404.

     GitHub Pages serves static files and cannot issue a 301, so the redirect
     is done the two ways a static host can:

       - rel=canonical tells crawlers which URL is the real one, so ranking
         consolidates on /privacy/ rather than being split between two URLs.
       - meta refresh with a 0 delay moves an actual visitor. Google treats a
         0-delay refresh as a permanent redirect, but it is a weaker signal
         than a 301, which is why the canonical carries the real weight.

     robots is noindex so this stub never competes with the page it points at;
     follow is kept so the canonical and the link below are still crawled.

     Do not add content here. If this page ever needs to say something, that
     is a sign the redirect should have been a real one at the server.
     ========================================================================== -->

<title>Privacy Policy — Rellony</title>
<link rel="canonical" href="https://rellony.com/privacy/">
<meta name="robots" content="noindex, follow">
<meta http-equiv="refresh" content="0; url=/privacy/">

<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>
  <!-- Visible only if the refresh is blocked or scripting-free assistive
       tooling stops here. It has to be a real link, not just a message. -->
  <p>This page has moved to <a href="/privacy/">rellony.com/privacy</a>.</p>
</body>
</html>
